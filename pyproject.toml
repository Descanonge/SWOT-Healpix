
[build-system]
requires = ['setuptools>=64', 'setuptools-scm>=8']
build-backend = 'setuptools.build_meta'

[project]
dynamic = ['version']

name = 'swot-healpix'
authors = [
    {name='Clément Haëck', email='clement.haeck@cnrs.fr'}
]
description = 'Resample SWOT data on Healpix'

readme = 'README.md'
requires-python = '>=3.13'

classifiers = []
dependencies = []

[tool.setuptools_scm]
[tool.setuptools]
packages = ['swot_healpix']

[tool.mypy]
ignore_missing_imports = true
exclude = []

[tool.ruff]
line-length = 88
target-version = 'py314'
extend-exclude = []

[tool.ruff.lint]
# extend-select = [
#        'E',  # pycodestyle
#        'W',  # pycodestyle
#        'I',  # isort
#        'N',  # pep8-name
#        'B',  # bugbear
#        'G',  # flake8-logging-format
#        'ARG', # flak
#        'F',  # pyflakes
#        'UP',  #pyupgrade
#        'D',  #pydocstyle
#        'PL', # pylint
# ]
extend-select = [
    'ANN',  # flake8-annotations
    'FBT',  # flake8-boolean-trap
    'B',    # flake8-bugbear
    'A',    # flake8-builtins
    'C4',   # flake8-comprehensions
    'FIX',  # flake8-fixme
    'ISC',  # flake8-implicit-str-concat
    'PIE',  # flake8-pie
    'Q',    # flake8-quotes
    # 'RET',  # flake8-return
    'SIM',  # flake8-simplify
    'ARG',  # flake8-unused-arguments
    'PTH',  # flake8-use-pathlib

    'I',    # isort
    'N',    # pep8-naming
    'E',    # pycodestyle Error
    'W',    # pycodestyle Warning
    'DOC',  # pydoclint
    'D',    # pydocstyle
    'F',    # Pyflakes
    'PL',   # Pylint
    'UP',   # pyupgrade
    'RUF',  # ruff
]

ignore = [
       'E226', # missing whitespace around arithmetic operator
       'ANN401', # allow Any types
       'D203', # one blank line before class
       'D213', # multiline docstring start at 2nd line
       'D417', # not all parameters need doc
       'D105', # no docstring for magic method
       'PLR2004', # magic values
       'PLR0913', # too many arguments
       'PLC0415', # import not top of the file
]

unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"**.ipynb" = [
           "B018",
           "B905",
           "D100",
           "I001",
           "E402",
]

[tool.ruff.lint.pydocstyle]
convention = 'numpy'
