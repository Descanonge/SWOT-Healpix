name: swot-healpix
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14

# IPython / Jupyter
  - jupyterlab
  - ipython
  - ipykernel
  - jupyter_console

# Basic science stack
  - numpy
  - scipy
  - pandas
  - pytorch

# Visualization stack
  - matplotlib
  - cartopy
  - cmocean
  - nc-time-axis
  - tol-colors
  - ipympl

# Healpix
  - cdshealpix

# Xarray
  - xarray
  - netCDF4
  - h5netcdf
  - zarr
  - cftime
  - bottleneck

  - dask
  - python-graphviz

# Object storage
  - boto3
  - fsspec
  - s3fs
  - zcollection

# Linting et al.
  - ruff
  - isort
  - mypy
  - jedi
  - pytest

  - pip
  - pip:
    - ipython-autoimport
    - jupyter-ruff

    - healpix-geo
    - healpix-plot
    - healpix-resample
    - healpix-analyse

    - tqdm
